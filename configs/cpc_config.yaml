# CPC Configuration for Fin-Whale Audio
# Based on stable-pretraining framework

# Backbone type: 'gru' or 'transformer'
backbone_type: transformer  # Options: 'gru', 'transformer'

# Experiment name
sample_rate: 16000
exp_name: cpc_finwhale_smalldata

# Data paths
train_data_path: "/root/ICML_2026_FIN_HUMPBACK_WHALE/RESOURCES/MEDITERRANEAN_FIN_WHALE"
val_data_path: "/root/ICML_2026_FIN_HUMPBACK_WHALE/RESOURCES/MEDITERRANEAN_FIN_WHALE"  # Can be different from train

results_path: "/root/results"

timestep: 12
hidden_dim: 256
num_epochs: 10
batch_size: 128
lr: 5.0e-5

# Random seed for reproducibility
seed: 42

# Model configuration
model:
  sample_rate: ${sample_rate}  # Fin-whale audio sample rate
  enc_hidden: 512    # Encoder output dimension
  sinc_channels: 512 # SincNet output channels
  timestep: ${timestep}       # Number of future steps to predict
  tau: 0.05          # Temperature for InfoNCE loss
  normalize: true   # Whether to normalize features in loss (ssl-whales uses false)
  
  # GRU-specific parameters (used when backbone_type: gru)
  gru_hidden: ${hidden_dim}    # GRU hidden dimension
  
  # Transformer-specific parameters (used when backbone_type: transformer)
  transformer_hidden: ${hidden_dim}    # Transformer hidden dimension (increased from 256)
  num_layers: 8             # Number of transformer layers (increased from 4)
  num_heads: 4               # Number of attention heads (must divide transformer_hidden)
  mlp_ratio: 4.0             # MLP hidden dim ratio (default from stable-pretraining)
  drop_path: 0.0             # Stochastic depth rate (default from stable-pretraining)
  attn_drop: 0.0             # Attention dropout (default from stable-pretraining)
  proj_drop: 0.0             # Projection dropout (default from stable-pretraining)
  pos_encoding: sinusoidal   # Positional encoding: 'sinusoidal' or 'learnable'

# Optimizer configuration
optim:
  optimizer:
    type: AdamW
    lr: ${lr}
    weight_decay: 1.0e-5
    betas: [0.9, 0.999]
  
  scheduler:
    type: LinearWarmupCosineAnnealing
    peak_step: 0.05
    start_factor: 0.01
    end_lr: 0.0
  
  interval: step
  frequency: 1

# Data configuration
data:
  train_data_folder: ${train_data_path}  # Training data path
  val_data_folder: ${val_data_path}      # Validation data path
  window_duration_sec: 8.0      # Window size in seconds
  hop_duration_sec: 1.5          # Hop size: 4s = 50% overlap
  sample_rate: ${sample_rate}    # Target sample rate
  batch_size: ${batch_size}                 # Batch size (adjust based on GPU memory)
  num_workers: 4                 # Number of data loading workers
  shuffle_train: true            # Shuffle training data
  shuffle_val: false             # Don't shuffle validation data
  train_data_fraction: 1.0       # Fraction of training data to use (0.1 = 10%, 1.0 = 100%)

# Trainer configuration
trainer:
  accelerator: gpu
  devices: 1
  max_epochs: ${num_epochs}
  precision: 32
  num_sanity_val_steps: 2
  enable_checkpointing: true
  logger: wandb  # Options: 'wandb', 'tensorboard', 'csv'
  log_dir: ${results_path}/logs/

# Checkpoint configuration
checkpoint:
  monitor: eval/linear_probe_f1  # Auto-set based on probe_type: 'linear_probe_f1' for spt, 'sklearn_probe_f1' for sklearn
  mode: max
  save_top_k: 1       # Only save the best checkpoint
  save_last: true     # Also save the last checkpoint
  dirpath: ${results_path}/ckpts_small/
  filename: best      # Best checkpoint will be saved as "best.ckpt"
                      # Last checkpoint will be saved as "last.ckpt"

# Evaluation configuration
use_probes: true  # Enable offline evaluation probes (for labeled validation data)

# Probe configuration
probe_type: sklearn  # Options: 'sklearn' (PCA+CV) or 'spt' (stable-pretraining style, no PCA)
probe_train_epochs: 100  # Training epochs for linear probe
probe_lr: 0.1  # Learning rate (0.1 is standard for LARS optimizer)
probe_weight_decay: 0.0  # Weight decay (0.0 is standard for SSL probes)
probe_optimizer: lars  # Optimizer: 'lars', 'adamw', 'adam', 'sgd'

# Sklearn probe settings (only used if probe_type='sklearn')
probe_pca_components: 50  # PCA components for sklearn probe

# KNN configuration
knn_queue_length: 20000    # Maximum samples to cache in validation queue
knn_k: 10                  # Number of nearest neighbors
knn_temperature: 0.07      # Temperature for distance weighting
knn_distance_metric: euclidean  # Distance metric: euclidean, cosine, manhattan

# WandB configuration (optional)
wandb:
  project: finwhale-cpc
  entity: haodoz0118-brown-university
  name: ${exp_name}
  save_dir: wandb_logs
disable_wandb: false  # Set to false to enable WandB logging

# Checkpoint path for resuming (optional)
ckpt_path: null
